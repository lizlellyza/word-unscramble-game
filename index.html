<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Unscramble Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 700px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
        }

        /* Modal Styles */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.hidden {
            display: none;
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 90%;
        }

        .modal-content h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.8em;
        }

        .modal-content p {
            color: #666;
            margin-bottom: 20px;
            font-size: 1.1em;
        }

        .modal-content input {
            width: 100%;
            padding: 12px;
            font-size: 1em;
            border: 2px solid #ddd;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .modal-content input:focus {
            outline: none;
            border-color: #667eea;
        }

        .level-selector {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }

        .level-btn {
            padding: 15px 20px;
            font-size: 1.1em;
            border: 2px solid #ddd;
            background: white;
            color: #333;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .level-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .level-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
        }

        .game-area {
            display: none;
        }

        .game-area.active {
            display: block;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            gap: 10px;
        }

        .player-info {
            background: #667eea;
            color: white;
            padding: 8px 15px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1em;
        }

        .current-player {
            white-space: nowrap;
        }

        .btn-players-list {
            padding: 8px 15px;
            background: #764ba2;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-players-list:hover {
            background: #653a8a;
        }

        .players-list {
            position: fixed;
            top: 0;
            right: -350px;
            width: 330px;
            height: 100vh;
            background: white;
            box-shadow: -2px 0 10px rgba(0, 0, 0, 0.2);
            padding: 20px;
            z-index: 999;
            overflow-y: auto;
            transition: right 0.3s ease;
        }

        .players-list.show {
            right: 0;
        }

        .players-list h3 {
            color: #333;
            margin-bottom: 15px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .btn-close-players {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #ddd;
            border: none;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            cursor: pointer;
            font-size: 1.2em;
            font-weight: bold;
        }

        .player-score-item {
            padding: 12px;
            margin-bottom: 10px;
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .player-score-item.current {
            background: #e7f3ff;
            border-left-color: #28a745;
        }

        .player-name {
            font-weight: 600;
            color: #333;
        }

        .player-score {
            background: #667eea;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9em;
        }

        .progress {
            margin-bottom: 20px;
            text-align: center;
            color: #666;
            font-weight: 600;
        }

        .word-display {
            background: #f8f9fa;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 25px;
        }

        .scrambled-word {
            font-size: 2.5em;
            color: #667eea;
            letter-spacing: 5px;
            font-weight: bold;
            margin-bottom: 10px;
            font-family: 'Courier New', monospace;
        }

        .hint {
            color: #999;
            font-size: 0.9em;
            font-style: italic;
        }

        .input-section {
            margin-bottom: 20px;
        }

        .input-section label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        .input-section input {
            width: 100%;
            padding: 12px;
            font-size: 1.1em;
            border: 2px solid #ddd;
            border-radius: 8px;
            transition: border-color 0.3s;
        }

        .input-section input:focus {
            outline: none;
            border-color: #667eea;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .btn {
            padding: 12px 20px;
            font-size: 1em;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-submit {
            background: #667eea;
            color: white;
        }

        .btn-submit:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .btn-skip {
            background: #e0e0e0;
            color: #333;
        }

        .btn-skip:hover {
            background: #d0d0d0;
        }

        .btn-reset {
            grid-column: 1 / -1;
            background: #999;
            color: white;
        }

        .btn-reset:hover {
            background: #888;
        }

        .feedback {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
            font-weight: 600;
            display: none;
        }

        .feedback.show {
            display: block;
        }

        .feedback.correct {
            background: #d4edda;
            color: #155724;
            border: 2px solid #28a745;
        }

        .feedback.incorrect {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #f5c6cb;
        }

        .answer-tracker {
            background: #e7f3ff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 2px solid #b3d9ff;
        }

        .correct-answer-entry {
            padding: 8px;
            margin-bottom: 8px;
            background: white;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .answer-player-name {
            font-weight: 600;
            color: #004085;
        }

        .score-board {
            background: #f0f0f0;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
        }

        .score-item {
            display: inline-block;
            margin: 0 15px;
        }

        .score-label {
            color: #666;
            font-size: 0.9em;
        }

        .score-value {
            font-size: 1.8em;
            color: #667eea;
            font-weight: bold;
        }

        .results-section {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 10px;
            display: none;
        }

        .results-section.active {
            display: block;
        }

        .results-section h2 {
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }

        .final-leaderboard {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
            border: 2px solid #667eea;
        }

        .final-leaderboard h3 {
            color: #333;
            margin-bottom: 15px;
            text-align: center;
        }

        .leaderboard-entry {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            margin-bottom: 10px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .leaderboard-entry.first {
            background: #fff8dc;
            border-left-color: #ffc107;
        }

        .leaderboard-entry.second {
            background: #f5f5f5;
            border-left-color: #c0c0c0;
        }

        .leaderboard-entry.third {
            background: #fef5e7;
            border-left-color: #cd7f32;
        }

        .leaderboard-rank {
            font-size: 1.3em;
            font-weight: bold;
            width: 30px;
        }

        .leaderboard-rank.first::before {
            content: '🥇';
        }

        .leaderboard-rank.second::before {
            content: '🥈';
        }

        .leaderboard-rank.third::before {
            content: '🥉';
        }

        .leaderboard-player {
            font-weight: 600;
            color: #333;
            flex: 1;
        }

        .leaderboard-score {
            background: #667eea;
            color: white;
            padding: 6px 15px;
            border-radius: 20px;
            font-weight: 600;
        }

        .results-list {
            background: white;
            padding: 15px;
            border-radius: 10px;
            max-height: 300px;
            overflow-y: auto;
            margin-bottom: 20px;
        }

        .result-item {
            padding: 12px;
            margin-bottom: 10px;
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            border-radius: 5px;
        }

        .result-item.correct {
            border-left-color: #28a745;
        }

        .result-item.incorrect {
            border-left-color: #dc3545;
        }

        .result-word {
            font-weight: 600;
            color: #333;
        }

        .result-answer {
            color: #666;
            font-size: 0.9em;
        }

        .email-section {
            margin-top: 25px;
            padding: 20px;
            background: #e7f3ff;
            border-radius: 10px;
            border: 2px solid #b3d9ff;
        }

        .email-section h3 {
            color: #004085;
            margin-bottom: 10px;
        }

        .email-section input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #b3d9ff;
            border-radius: 5px;
            font-size: 0.95em;
        }

        .btn-email {
            width: 100%;
            background: #004085;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-email:hover {
            background: #003068;
        }

        .message {
            margin-top: 10px;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            display: none;
        }

        .message.show {
            display: block;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.8em;
                margin-bottom: 20px;
            }

            .level-selector {
                grid-template-columns: 1fr;
            }

            .scrambled-word {
                font-size: 2em;
            }

            .score-item {
                display: block;
                margin: 10px 0;
            }

            .game-header {
                flex-direction: column;
                gap: 10px;
            }

            .players-list {
                width: 100%;
                right: -100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Word Unscramble</h1>

        <!-- Player Name Modal -->
        <div class="modal" id="nameModal">
            <div class="modal-content">
                <h2>Welcome! 👋</h2>
                <p>Enter your name to start playing</p>
                <input 
                    type="text" 
                    id="playerNameInput" 
                    placeholder="Enter your name..."
                    autocomplete="off"
                    onkeypress="if(event.key==='Enter') setPlayerName()"
                >
                <button class="btn btn-submit" onclick="setPlayerName()" style="width: 100%; margin-top: 15px;">Start Playing</button>
            </div>
        </div>

        <!-- Level Selection -->
        <div class="level-selector" id="levelSelector" style="display: none;">
            <button class="level-btn" onclick="startLevel(1)">
                <div>Level 1</div>
                <div style="font-size: 0.8em;">Easy</div>
            </button>
            <button class="level-btn" onclick="startLevel(2)">
                <div>Level 2</div>
                <div style="font-size: 0.8em;">Moderate</div>
            </button>
            <button class="level-btn" onclick="startLevel(3)">
                <div>Level 3</div>
                <div style="font-size: 0.8em;">Difficult</div>
            </button>
        </div>

        <!-- Game Area -->
        <div class="game-area" id="gameArea">
            <div class="game-header">
                <div class="player-info">
                    <span class="current-player">👤 <span id="currentPlayerName">Player</span></span>
                </div>
                <div style="flex: 1; text-align: center;">
                    <div style="font-weight: 600; color: #333;">Level <span id="levelDisplay">1</span></div>
                </div>
                <div style="text-align: right;">
                    <button class="btn-players-list" onclick="togglePlayersList()">👥 Players</button>
                </div>
            </div>

            <div class="players-list" id="playersList">
                <h3>🏆 Players & Scores</h3>
                <div id="playersScoreBoard"></div>
                <button class="btn-close-players" onclick="togglePlayersList()">✕</button>
            </div>

            <div class="score-board">
                <div class="score-item">
                    <div class="score-label">Correct</div>
                    <div class="score-value" id="correctCount">0</div>
                </div>
                <div class="score-item">
                    <div class="score-label">Progress</div>
                    <div class="score-value" id="progressText">0/5</div>
                </div>
                <div class="score-item">
                    <div class="score-label">Skipped</div>
                    <div class="score-value" id="skippedCount">0</div>
                </div>
            </div>

            <div class="progress" id="progressBar"></div>

            <div class="word-display">
                <div class="scrambled-word" id="scrambledWord">EXAMPLE</div>
                <div class="hint" id="hint">Guess the word!</div>
            </div>

            <div class="feedback" id="feedback"></div>

            <div class="answer-tracker" id="answerTracker" style="display: none;">
                <div style="font-weight: 600; margin-bottom: 10px;">✓ Correct Answers:</div>
                <div id="correctAnswersList"></div>
            </div>

            <div class="input-section">
                <label for="answerInput">Your Answer:</label>
                <input 
                    type="text" 
                    id="answerInput" 
                    placeholder="Type your answer here..." 
                    autocomplete="off"
                    onkeypress="if(event.key==='Enter') submitAnswer()"
                >
            </div>

            <div class="button-group">
                <button class="btn btn-submit" onclick="submitAnswer()">Submit</button>
                <button class="btn btn-skip" onclick="skipWord()">Skip</button>
                <button class="btn btn-reset" onclick="resetGame()">Back to Menu</button>
            </div>
        </div>

        <!-- Results Section -->
        <div class="results-section" id="resultsSection">
            <h2>🎉 Level Complete!</h2>

            <div class="final-leaderboard" id="finalLeaderboard">
                <h3>🏆 Final Leaderboard</h3>
                <div id="leaderboardContent"></div>
            </div>

            <div class="results-list" id="resultsList"></div>

            <div class="email-section">
                <h3>📧 Email Your Results</h3>
                <input 
                    type="email" 
                    id="emailInput" 
                    placeholder="Enter your email address"
                    value="lizlellyza.ugot@amadeus.com"
                >
                <button class="btn-email" onclick="sendResults()">Send Results</button>
                <div class="message" id="emailMessage"></div>
            </div>

            <div style="margin-top: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <button class="btn btn-submit" onclick="resetGameToMenu()" style="width: 100%;">Main Menu</button>
                <button class="btn btn-skip" onclick="location.reload()" style="width: 100%;">Restart Game</button>
            </div>
        </div>
    </div>

    <script>
        // Game Data
        const gameData = {
            1: {
                name: 'Easy',
                words: [
                    { scrambled: 'TAC', answer: 'CAT', hint: 'A furry pet' },
                    { scrambled: 'GOD', answer: 'DOG', hint: 'Man\'s best friend' },
                    { scrambled: 'EER', answer: 'ERE', hint: 'Before (archaic)' },
                    { scrambled: 'RTA', answer: 'ART', hint: 'Creative work' },
                    { scrambled: 'UNS', answer: 'SUN', hint: 'Bright in the sky' }
                ]
            },
            2: {
                name: 'Moderate',
                words: [
                    { scrambled: 'TRAP', answer: 'PART', hint: 'A piece of something' },
                    { scrambled: 'SORE', answer: 'ROSE', hint: 'A beautiful flower' },
                    { scrambled: 'TEAR', answer: 'RATE', hint: 'Speed or evaluate' },
                    { scrambled: 'POTS', answer: 'STOP', hint: 'Come to a halt' },
                    { scrambled: 'REAMS', answer: 'TEAMS', hint: 'Groups of people' }
                ]
            },
            3: {
                name: 'Difficult',
                words: [
                    { scrambled: 'ABLEST', answer: 'STABLE', hint: 'Steady and firm' },
                    { scrambled: 'LISTEN', answer: 'SILENT', hint: 'Quiet and still' },
                    { scrambled: 'CARTONS', answer: 'CARTOON', hint: 'Animated show' },
                    { scrambled: 'SENATOR', answer: 'TREASON', hint: 'Betrayal of country' },
                    { scrambled: 'RECITALS', answer: 'ARTICLES', hint: 'Written pieces' }
                ]
            }
        };

        // Game State
        let gameState = {
            currentLevel: null,
            currentWordIndex: 0,
            correct: 0,
            skipped: 0,
            results: [],
            words: [],
            currentPlayer: null,
            allPlayers: {},
            correctAnsweredBy: {}
        };

        // Initialize on page load
        function initGame() {
            loadPlayersFromStorage();
            showNameModal();
        }

        function showNameModal() {
            const modal = document.getElementById('nameModal');
            const input = document.getElementById('playerNameInput');
            if (modal) {
                modal.classList.remove('hidden');
                if (input) input.focus();
            }
        }

        function setPlayerName() {
            const name = document.getElementById('playerNameInput').value.trim();
            if (!name) {
                alert('Please enter your name!');
                return;
            }

            gameState.currentPlayer = name;
            document.getElementById('currentPlayerName').textContent = name;

            // Add player to all players list
            if (!gameState.allPlayers[name]) {
                gameState.allPlayers[name] = {
                    name: name,
                    score: 0,
                    level: null
                };
            }

            savePlayersToStorage();
            document.getElementById('nameModal').classList.add('hidden');
            document.getElementById('levelSelector').style.display = 'grid';
        }

        function startLevel(level) {
            gameState.currentLevel = level;
            gameState.currentWordIndex = 0;
            gameState.correct = 0;
            gameState.skipped = 0;
            gameState.results = [];
            gameState.words = JSON.parse(JSON.stringify(gameData[level].words));
            gameState.correctAnsweredBy = {};

            // Update player level
            gameState.allPlayers[gameState.currentPlayer].level = level;
            savePlayersToStorage();

            // Hide level selector and show game area
            document.getElementById('levelSelector').style.display = 'none';
            document.getElementById('gameArea').classList.add('active');
            document.getElementById('resultsSection').classList.remove('active');
            document.getElementById('levelDisplay').textContent = level;

            loadWord();
        }

        function loadWord() {
            if (gameState.currentWordIndex >= gameState.words.length) {
                showResults();
                return;
            }

            const word = gameState.words[gameState.currentWordIndex];
            document.getElementById('scrambledWord').textContent = word.scrambled;
            document.getElementById('hint').textContent = word.hint;
            document.getElementById('answerInput').value = '';
            document.getElementById('feedback').classList.remove('show', 'correct', 'incorrect');

            updateProgress();
            updateCorrectAnswersDisplay();
            document.getElementById('answerInput').focus();
        }

        function updateProgress() {
            const total = gameState.words.length;
            const current = gameState.currentWordIndex + 1;
            document.getElementById('progressBar').textContent = `Word ${current} of ${total}`;
            document.getElementById('correctCount').textContent = gameState.correct;
            document.getElementById('skippedCount').textContent = gameState.skipped;
            document.getElementById('progressText').textContent = `${gameState.currentWordIndex}/${total}`;
        }

        function updateCorrectAnswersDisplay() {
            const wordIndex = gameState.currentWordIndex;
            const correctAnswers = gameState.correctAnsweredBy[wordIndex];

            const tracker = document.getElementById('answerTracker');
            const list = document.getElementById('correctAnswersList');

            if (correctAnswers && Object.keys(correctAnswers).length > 0) {
                tracker.style.display = 'block';
                list.innerHTML = '';

                Object.entries(correctAnswers).forEach(([playerName, isCorrect]) => {
                    if (isCorrect) {
                        const div = document.createElement('div');
                        div.className = 'correct-answer-entry';
                        div.innerHTML = `
                            <span class="answer-player-name">✓ ${playerName}</span>
                            <span style="color: #28a745; font-weight: 600;">Got it!</span>
                        `;
                        list.appendChild(div);
                    }
                });
            } else {
                tracker.style.display = 'none';
            }
        }

        function submitAnswer() {
            const userAnswer = document.getElementById('answerInput').value.trim().toUpperCase();
            const correctAnswer = gameState.words[gameState.currentWordIndex].answer;
            const feedback = document.getElementById('feedback');

            if (!userAnswer) {
                feedback.textContent = 'Please enter an answer!';
                feedback.classList.add('show', 'incorrect');
                return;
            }

            const wordIndex = gameState.currentWordIndex;

            // Initialize correctAnsweredBy for this word if not exists
            if (!gameState.correctAnsweredBy[wordIndex]) {
                gameState.correctAnsweredBy[wordIndex] = {};
            }

            if (userAnswer === correctAnswer) {
                // Check if this is the first time anyone got this word correct
                const isFirst = !Object.values(gameState.correctAnsweredBy[wordIndex]).some(v => v === true);

                feedback.textContent = isFirst 
                    ? `🎉 ${gameState.currentPlayer} got it FIRST! The answer is: ${correctAnswer}`
                    : `✓ Correct! (${gameState.currentPlayer})`;
                feedback.classList.add('show', 'correct');
                gameState.correct++;
                gameState.correctAnsweredBy[wordIndex][gameState.currentPlayer] = true;

                gameState.results.push({
                    word: correctAnswer,
                    userAnswer: userAnswer,
                    correct: true,
                    player: gameState.currentPlayer
                });

                // Update all players' scores
                gameState.allPlayers[gameState.currentPlayer].score++;
            } else {
                gameState.correctAnsweredBy[wordIndex][gameState.currentPlayer] = false;
                feedback.textContent = `✗ Wrong! The answer is: ${correctAnswer}`;
                feedback.classList.add('show', 'incorrect');
                gameState.results.push({
                    word: correctAnswer,
                    userAnswer: userAnswer,
                    correct: false,
                    player: gameState.currentPlayer
                });
            }

            updatePlayersDisplay();
            savePlayersToStorage();

            setTimeout(() => {
                gameState.currentWordIndex++;
                loadWord();
            }, 1500);
        }

        function skipWord() {
            const correctAnswer = gameState.words[gameState.currentWordIndex].answer;
            const wordIndex = gameState.currentWordIndex;

            if (!gameState.correctAnsweredBy[wordIndex]) {
                gameState.correctAnsweredBy[wordIndex] = {};
            }

            gameState.correctAnsweredBy[wordIndex][gameState.currentPlayer] = false;
            gameState.skipped++;
            gameState.results.push({
                word: correctAnswer,
                userAnswer: 'SKIPPED',
                correct: false,
                player: gameState.currentPlayer
            });

            gameState.currentWordIndex++;
            loadWord();
        }

        function togglePlayersList() {
            const playersList = document.getElementById('playersList');
            playersList.classList.toggle('show');
            if (playersList.classList.contains('show')) {
                updatePlayersDisplay();
            }
        }

        function updatePlayersDisplay() {
            const scoreboard = document.getElementById('playersScoreBoard');
            if (!scoreboard) return;
            
            scoreboard.innerHTML = '';

            // Sort players by score
            const sortedPlayers = Object.values(gameState.allPlayers)
                .sort((a, b) => b.score - a.score);

            if (sortedPlayers.length === 0) {
                scoreboard.innerHTML = '<p style="color: #666;">No players yet. Start playing!</p>';
                return;
            }

            sortedPlayers.forEach(player => {
                const div = document.createElement('div');
                div.className = `player-score-item ${player.name === gameState.currentPlayer ? 'current' : ''}`;
                div.innerHTML = `
                    <span class="player-name">${player.name}</span>
                    <span class="player-score">${player.score}</span>
                `;
                scoreboard.appendChild(div);
            });
        }

        function showResults() {
            document.getElementById('gameArea').classList.remove('active');
            document.getElementById('resultsSection').classList.add('active');

            // Display leaderboard
            const leaderboardContent = document.getElementById('leaderboardContent');
            leaderboardContent.innerHTML = '';

            const sortedPlayers = Object.values(gameState.allPlayers)
                .sort((a, b) => b.score - a.score);

            sortedPlayers.forEach((player, index) => {
                const div = document.createElement('div');
                const rankClass = index === 0 ? 'first' : index === 1 ? 'second' : index === 2 ? 'third' : '';
                div.className = `leaderboard-entry ${rankClass}`;
                div.innerHTML = `
                    <span class="leaderboard-rank ${rankClass}"></span>
                    <span class="leaderboard-player">${player.name}</span>
                    <span class="leaderboard-score">${player.score}</span>
                `;
                leaderboardContent.appendChild(div);
            });

            // Display results for current player
            const resultsList = document.getElementById('resultsList');
            resultsList.innerHTML = '<h3 style="margin-bottom: 15px; color: #333;">Your Results:</h3>';

            gameState.results.forEach(result => {
                const div = document.createElement('div');
                div.className = `result-item ${result.correct ? 'correct' : 'incorrect'}`;
                div.innerHTML = `
                    <div class="result-word">${result.word}</div>
                    <div class="result-answer">Your answer: ${result.userAnswer}</div>
                `;
                resultsList.appendChild(div);
            });
        }

        function resetGameToMenu() {
            gameState.currentLevel = null;
            gameState.currentWordIndex = 0;
            gameState.correct = 0;
            gameState.skipped = 0;
            gameState.results = [];
            gameState.words = [];
            gameState.correctAnsweredBy = {};

            document.getElementById('levelSelector').style.display = 'grid';
            document.getElementById('gameArea').classList.remove('active');
            document.getElementById('resultsSection').classList.remove('active');
            document.getElementById('emailMessage').classList.remove('show');
        }

        function resetGame() {
            // Clear only game session data, preserve all players
            const preservedPlayers = gameState.allPlayers;
            
            gameState = {
                currentLevel: null,
                currentWordIndex: 0,
                correct: 0,
                skipped: 0,
                results: [],
                words: [],
                currentPlayer: null,
                allPlayers: preservedPlayers,
                correctAnsweredBy: {}
            };

            document.getElementById('nameModal').classList.remove('hidden');
            document.getElementById('playerNameInput').value = '';
            document.getElementById('playerNameInput').focus();
            document.getElementById('levelSelector').style.display = 'none';
            document.getElementById('gameArea').classList.remove('active');
            document.getElementById('resultsSection').classList.remove('active');
            document.getElementById('emailMessage').classList.remove('show');
        }

        function sendResults() {
            const email = document.getElementById('emailInput').value.trim();
            const messageDiv = document.getElementById('emailMessage');

            if (!email) {
                messageDiv.textContent = 'Please enter an email address';
                messageDiv.classList.add('show', 'error');
                return;
            }

            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                messageDiv.textContent = 'Please enter a valid email address';
                messageDiv.classList.add('show', 'error');
                return;
            }

            // Prepare email content
            const levelName = gameData[gameState.currentLevel].name;
            const score = gameState.correct;
            const total = gameState.words.length;
            const percentage = Math.round((score / total) * 100);

            let resultsText = `Word Unscramble Game - Level ${gameState.currentLevel} (${levelName})\n`;
            resultsText += `Player: ${gameState.currentPlayer}\n`;
            resultsText += `Score: ${score}/${total} (${percentage}%)\n\n`;
            resultsText += 'Results:\n';
            resultsText += '--------\n';

            gameState.results.forEach((result, index) => {
                resultsText += `${index + 1}. ${result.word}\n`;
                resultsText += `   Your answer: ${result.userAnswer}\n`;
                resultsText += `   Status: ${result.correct ? 'CORRECT ✓' : 'INCORRECT ✗'}\n\n`;
            });

            resultsText += '\nAll Players Scores:\n';
            resultsText += '------------------\n';
            const sortedPlayers = Object.values(gameState.allPlayers)
                .sort((a, b) => b.score - a.score);
            sortedPlayers.forEach((player, index) => {
                resultsText += `${index + 1}. ${player.name}: ${player.score} points\n`;
            });

            // Send email via backend
            fetch('https://formspree.io/f/mgvvgjra', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    email: email,
                    message: resultsText,
                    subject: `Word Unscramble Game Results - ${gameState.currentPlayer} - Level ${gameState.currentLevel}`
                })
            })
            .then(response => {
                if (response.ok) {
                    messageDiv.textContent = '✓ Results sent successfully!';
                    messageDiv.classList.remove('error');
                    messageDiv.classList.add('show', 'success');
                } else {
                    throw new Error('Failed to send');
                }
            })
            .catch(error => {
                messageDiv.textContent = 'Note: Email service unavailable. Try again later.';
                messageDiv.classList.remove('success');
                messageDiv.classList.add('show', 'error');
                console.log('Email data would be:', resultsText);
            });
        }

        // Local Storage Functions
        function savePlayersToStorage() {
            localStorage.setItem('wordGamePlayers', JSON.stringify(gameState.allPlayers));
        }

        function loadPlayersFromStorage() {
            const stored = localStorage.getItem('wordGamePlayers');
            if (stored) {
                gameState.allPlayers = JSON.parse(stored);
            }
        }

        // Initialize game on page load
        document.addEventListener('DOMContentLoaded', function() {
            initGame();
        });
    </script>
</body>
</html>
